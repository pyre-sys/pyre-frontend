<!-- Título y botón en la misma línea -->
<div class="container-fluid page-shell page-header-container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div></div>
    <a class="header-action" (click)="createNewUser()" role="button">
      <i class="bx bx-plus bx-tada" aria-hidden="true"></i> Agregar
    </a>
  </div>
</div>

<div class="user-list-container visor-usuarios container-fluid page-shell mt-2">
  <div class="pyre-table-shell">
    <!-- Filter bar -->
    <div class="pyre-filter-bar container-fluid">
      <div class="row g-3 align-items-end">
        <!-- Legajo -->
        <div class="col-xl-2 col-lg-2 col-md-3 col-sm-6">
          <div class="filter-item">
            <div class="filter-input-group">
              <input
                type="text"
                class="form-control"
                [(ngModel)]="filtroLegajo"
                placeholder="Legajo"
                (keyup.enter)="onSearch()"
              />
            </div>
          </div>
        </div>

        <!-- Nombre -->
        <div class="col-xl-2 col-lg-2 col-md-3 col-sm-6">
          <div class="filter-item">
            <div class="filter-input-group">
              <input
                type="text"
                class="form-control"
                [(ngModel)]="filtroNombre"
                placeholder="Nombre"
                (keyup.enter)="onSearch()"
              />
            </div>
          </div>
        </div>

        <!-- Apellido -->
        <div class="col-xl-2 col-lg-2 col-md-3 col-sm-6">
          <div class="filter-item">
            <div class="filter-input-group">
              <input
                type="text"
                class="form-control"
                [(ngModel)]="filtroApellido"
                placeholder="Apellido"
                (keyup.enter)="onSearch()"
              />
            </div>
          </div>
        </div>

        <!-- Rol -->
        <div class="col-xl-2 col-lg-2 col-md-3 col-sm-6">
          <div class="filter-item">
            <div class="filter-input-group">
              <app-cbo-rol-usuario
                class="w-100"
                [(ngModel)]="filtroRol"
                [showOnlyActive]="true"
                [isId]="'filtroRolSelect'"
              >
              </app-cbo-rol-usuario>
            </div>
          </div>
        </div>

        <!-- Estado -->
        <div class="col-xl-2 col-lg-2 col-md-3 col-sm-6">
          <div class="filter-item">
            <div class="filter-input-group">
              <app-cbo-estado
                class="w-100"
                [(ngModel)]="filtroEstado"
                [isId]="'filtroEstadoSelect'"
              >
              </app-cbo-estado>
            </div>
          </div>
        </div>

        <!-- Reset + Buscar -->
        <div
          class="col-xl-2 col-lg-2 col-md-12 col-sm-12 d-flex justify-content-end"
        >
          <div class="d-flex gap-2">
            <button
              type="button"
              class="reset-button-inline"
              (click)="onResetFilters()"
              [disabled]="!hasActiveFilters()"
              [title]="
                hasActiveFilters()
                  ? 'Limpiar filtros'
                  : 'No hay filtros activos'
              "
            >
              <i class="pi pi-filter-slash"></i>
            </button>

            <button
              type="button"
              class="btn btn-primary"
              (click)="onSearch()"
              title="Buscar"
            >
              <i class="pi pi-search"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Spinner global -->
    <app-spinner [isLoading]="isLoading"></app-spinner>

    <!-- Custom table -->
    <div *ngIf="!isLoading" class="custom-table-container">
      <table class="custom-table">
        <thead>
          <tr>
            <th>Legajo</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of getPaginatedUsers(); let i = index">
            <td>
              <span class="legajo-badge">{{ user.legajo }}</span>
            </td>
            <td>{{ user.nombre }}</td>
            <td>{{ user.apellido }}</td>
            <td>{{ user.rol }}</td>
            <td>
              <div class="estado-toggle">
                <label
                  class="toggle-switch"
                  [ngbTooltip]="user.activo ? 'Activo' : 'Inactivo'"
                  placement="top"
                  container="body"
                >
                  <input
                    type="checkbox"
                    [checked]="user.activo"
                    (click)="toggleUserActive($event, user)"
                    [disabled]="user._pending"
                  />
                  <span
                    class="toggle-slider modern"
                    [class.active]="user.activo"
                  ></span>
                </label>
              </div>
            </td>
            <td>
              <div class="action-buttons">
                <button
                  type="button"
                  class="btn-icon btn-edit"
                  (click)="editUser(user)"
                  ngbTooltip="Ver/Editar usuario"
                  placement="top"
                  container="body"
                >
                  <i class="pi pi-eye"></i>
                </button>
                <button
                  type="button"
                  class="btn-icon btn-delete"
                  (click)="deleteUser(user)"
                  ngbTooltip="Eliminar usuario"
                  placement="top"
                  container="body"
                  *ngIf="isSuperAdmin"
                >
                  <i class="pi pi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="getPaginatedUsers().length === 0">
            <td colspan="6" class="empty-message">
              No se encontraron usuarios.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Reemplazar el paginador personalizado con el componente app-paginator -->
    <div *ngIf="!isLoading && totalItems > 0" class="paginator-container">
      <app-paginator
        [length]="totalItems"
        [pageSize]="pageSize"
        [pageIndex]="currentPage - 1"
        (pageChange)="onPageEvent($event)"
      >
      </app-paginator>
    </div>
  </div>

  <!-- Instancia del modal de usuario -->
  <app-usuarios-modal
    *ngIf="showUserModal"
    [initialData]="modalInitialData"
    [mode]="modalMode"
    (submit)="onModalSubmit($event)"
    (close)="closeUserModal()"
  ></app-usuarios-modal>
</div>
