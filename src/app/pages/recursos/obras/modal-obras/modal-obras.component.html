<div class="modal-overlay" *ngIf="visible" role="dialog" aria-modal="true">
  <div class="modal-wrapper" [class.readonly]="!editingEnabled">
    <div class="modal-content" [class.open]="visible">
      <div class="modal-header">
        <div class="header-controls">
          <div *ngIf="mode === 'edit'" class="mode-switch-wrapper">
            <button
              type="button"
              class="mode-switch"
              (click)="toggleEditing()"
              [attr.aria-pressed]="editingEnabled"
              [attr.aria-label]="
                editingEnabled ? 'Desactivar edición' : 'Activar edición'
              "
            >
              <span class="switch-track" [class.on]="editingEnabled">
                <span class="switch-thumb" [class.on]="editingEnabled"></span>
              </span>
            </button>
          </div>
          <h3 class="modal-title">
            {{
              mode === "edit"
                ? editingEnabled
                  ? "Modo edición"
                  : "Modo lectura"
                : "Nueva Obra"
            }}
          </h3>
        </div>
        <button class="close-btn" (click)="onCancel()" aria-label="Cerrar">
          <span class="pi pi-times" aria-hidden="true"></span>
        </button>
      </div>

      <!-- Indicador de loading para modo edición -->
      <div *ngIf="mode === 'edit' && !initialData" class="loading-container">
        <div class="loading-spinner"></div>
        <p>Cargando datos de la obra...</p>
      </div>

      <!-- Formulario ajustado para el modelo Obra -->
      <form
        *ngIf="mode === 'create' || initialData"
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        class="modal-form"
        autocomplete="off"
      >
        <div class="compact-form-grid">
          <!-- Campo: Código -->
          <div
            class="field-group"
            [class.has-error]="
              (form.get('Codigo')?.invalid && form.get('Codigo')?.touched) ||
              serverErrors['Codigo']
            "
          >
            <label class="required">Código</label>
            <input
              formControlName="Codigo"
              placeholder="Código único"
              [class.error]="
                (form.get('Codigo')?.invalid && form.get('Codigo')?.touched) ||
                serverErrors['Codigo']
              "
            />
            <div *ngIf="serverErrors['Codigo']" class="error-text">
              {{ serverErrors["Codigo"] }}
            </div>
            <div
              *ngIf="
                !serverErrors['Codigo'] &&
                form.get('Codigo')?.invalid &&
                form.get('Codigo')?.touched
              "
              class="error-text"
            >
              El código es requerido
            </div>
          </div>

          <!-- Campo: Nombre de la Obra -->
          <div
            class="field-group"
            [class.has-error]="
              (form.get('NombreObra')?.invalid &&
                form.get('NombreObra')?.touched) ||
              serverErrors['NombreObra']
            "
          >
            <label class="required">Nombre de la Obra</label>
            <input
              formControlName="NombreObra"
              placeholder="Nombre de la obra"
              [class.error]="
                (form.get('NombreObra')?.invalid &&
                  form.get('NombreObra')?.touched) ||
                serverErrors['NombreObra']
              "
            />
            <div *ngIf="serverErrors['NombreObra']" class="error-text">
              {{ serverErrors["NombreObra"] }}
            </div>
            <div
              *ngIf="
                !serverErrors['NombreObra'] &&
                form.get('NombreObra')?.invalid &&
                form.get('NombreObra')?.touched
              "
              class="error-text"
            >
              El nombre de la obra es requerido
            </div>
          </div>

          <!-- Campo: Ubicación -->
          <div class="field-group">
            <label
              >Ubicación <span class="optional-text">(opcional)</span></label
            >
            <input
              formControlName="Ubicacion"
              placeholder="Ubicación de la obra"
            />
          </div>

          <!-- Campo: Fecha de Inicio -->
          <div class="field-group">
            <label
              >Fecha de Inicio
              <span class="optional-text">(opcional)</span></label
            >
            <input formControlName="FechaInicio" type="date" />
          </div>

          <!-- Campo: Fecha de Fin -->
          <div class="field-group">
            <label
              >Fecha de Fin <span class="optional-text">(opcional)</span></label
            >
            <input formControlName="FechaFin" type="date" />
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn-cancel" (click)="onCancel()">
            Cancelar
          </button>
          <span
            [ngbTooltip]="
              !editingEnabled
                ? 'Pasa a modo edición para poder actualizar'
                : null
            "
            placement="top"
            container="body"
          >
            <button
              *ngIf="mode === 'edit'"
              [disabled]="!editingEnabled"
              type="submit"
              class="btn-submit"
            >
              Actualizar
            </button>
          </span>
          <button
            *ngIf="mode !== 'edit'"
            type="submit"
            class="btn-submit"
            [disabled]="form.invalid"
            ngbTooltip="Complete los campos obligatorios"
            [disableTooltip]="!form.invalid"
          >
            Crear
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
