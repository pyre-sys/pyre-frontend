<div class="cbo-usuario-wrapper">
  <!-- Label removed to unify titles externally -->

  <!-- Search input container -->
  <div
    class="search-container"
    [class.has-error]="hasErrors()"
    [class.is-expanded]="isOpen"
  >
    <div class="search-input-group">
      <!-- Main input - readonly when collapsed, editable when expanded -->
      <input
        [id]="isId"
        [value]="isOpen ? searchControl.value || '' : placeholder"
        [disabled]="isDisabled"
        [readonly]="!isOpen"
        [class.error]="hasErrors()"
        class="search-input"
        (click)="onMainInputClick()"
        (focus)="onMainInputFocus()"
        (blur)="onMainInputBlur()"
        (input)="onMainInputChange($event)"
        autocomplete="off"
      />

      <!-- Clear button -->
      <button
        *ngIf="selectedUsuario && !isDisabled && isOpen"
        type="button"
        class="clear-button"
        (click)="clearSelection()"
        title="Limpiar selección"
      >
        <i class="pi pi-times"></i>
      </button>

      <!-- Loading spinner -->
      <div *ngIf="isLoading" class="loading-spinner">
        <i class="pi pi-spinner pi-spin"></i>
      </div>

      <!-- Dropdown arrow -->
      <div
        *ngIf="!isLoading"
        class="dropdown-arrow"
        (click)="toggleDropdown($event)"
      >
        <i class="pi pi-chevron-down" [class.rotated]="isOpen"></i>
      </div>
    </div>

    <!-- Dropdown options -->
    <div *ngIf="isOpen && !isDisabled" class="dropdown-panel">
      <div class="dropdown-content">
        <!-- No results message -->
        <div *ngIf="usuarios.length === 0 && !isLoading" class="no-results">
          <i
            class="pi pi-search"
            style="font-size: 1.5rem; margin-bottom: 8px; opacity: 0.5"
          ></i>
          <div *ngIf="searchControl.value && searchControl.value.length < 3">
            Ingrese al menos 3 caracteres para buscar
          </div>
          <div *ngIf="searchControl.value && searchControl.value.length >= 3">
            No se encontraron usuarios que coincidan
          </div>
          <div *ngIf="!searchControl.value">No hay usuarios disponibles</div>
        </div>

        <!-- Options list -->
        <div
          *ngFor="let usuario of usuarios; trackBy: trackByUsuario"
          class="dropdown-option"
          [class.selected]="selectedUsuario?.id === usuario.id"
          (click)="onOptionClick(usuario)"
        >
          <div class="option-content">
            <!-- Left side: legajo + nombre -->
            <div class="option-main">
              <span class="option-codigo">{{ usuario.legajo }}</span>
              <span
                class="option-nombre"
                [title]="usuario.nombre + ' ' + usuario.apellido"
              >
                {{ usuario.nombre }} {{ usuario.apellido }}
              </span>
            </div>

            <!-- Right side: estado -->
            <div class="option-details">
              <span
                class="option-disponibilidad"
                [class.disponible]="usuario.activo"
              >
                {{ usuario.activo ? "Activo" : "Inactivo" }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Error message -->
  <div *ngIf="hasErrors()" class="error-message">
    {{ getErrorMessage() }}
  </div>

  <!-- Loading indicator -->
  <div *ngIf="isLoading && !isOpen" class="loading-indicator">
    <i class="pi pi-spinner pi-spin"></i>
    <span>Cargando usuarios...</span>
  </div>
</div>
