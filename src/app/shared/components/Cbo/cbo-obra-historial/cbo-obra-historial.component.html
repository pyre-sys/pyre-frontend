<div class="cbo-obra-historial-wrapper">
  <!-- Search input container -->
  <div
    class="search-container"
    [class.has-error]="hasErrors()"
    [class.is-expanded]="isOpen"
  >
    <div class="search-input-group">
      <!-- Main input -->
      <input
        [id]="isId"
        [value]="
          isOpen
            ? searchControl.value || ''
            : selectedObra
            ? selectedObra.displayText
            : placeholder
        "
        [disabled]="isDisabled"
        [readonly]="!isOpen || isDisabled"
        [class.error]="hasErrors()"
        class="search-input"
        (click)="onMainInputClick()"
        (focus)="onMainInputFocus()"
        (blur)="onMainInputBlur()"
        (input)="onMainInputChange($event)"
        autocomplete="off"
      />

      <!-- Clear button -->
      <button
        *ngIf="selectedObra && !isDisabled && isOpen"
        type="button"
        class="clear-button"
        (click)="clearSelection()"
        [ngbTooltip]="'Limpiar selección'"
        placement="top"
        container="body"
      >
        <i class="pi pi-times"></i>
      </button>

      <!-- Loading indicator -->
      <div *ngIf="isLoading" class="loading-indicator">
        <i class="pi pi-spin pi-spinner"></i>
      </div>

      <!-- Dropdown arrow -->
      <div
        *ngIf="!isLoading"
        class="dropdown-arrow"
        (click)="toggleDropdown($event)"
      >
        <i class="pi pi-chevron-down" [class.rotated]="isOpen"></i>
      </div>
    </div>

    <!-- Dropdown options -->
    <div *ngIf="isOpen && !isDisabled" class="dropdown-panel">
      <div class="dropdown-content">
        <!-- Loading message -->
        <div *ngIf="isLoading" class="loading-indicator">
          <span>Cargando obras...</span>
        </div>

        <!-- No results message -->
        <div *ngIf="!isLoading && obras.length === 0" class="no-results">
          <i
            class="pi pi-search"
            style="font-size: 1.5rem; margin-bottom: 8px; opacity: 0.5"
          ></i>
          <span *ngIf="!searchControl.value || searchControl.value.length < 2">
            Ingrese al menos 2 caracteres para buscar obras
          </span>
          <span *ngIf="searchControl.value && searchControl.value.length >= 2">
            No se encontraron obras
          </span>
        </div>

        <!-- Options list -->
        <div
          *ngFor="let obra of obras; trackBy: trackByObra"
          class="dropdown-option"
          [class.selected]="selectedObra?.idObra === obra.idObra"
          (click)="onOptionClick(obra)"
        >
          <div class="option-content">
            <!-- Left side: codigo -->
            <span class="option-codigo">{{ obra.codigo || "S/C" }}</span>
            <!-- Center: nombre truncado -->
            <span
              class="option-nombre"
              [ngbTooltip]="obra.nombreObra"
              placement="top"
              container="body"
            >
              {{ obra.nombreObra | slice : 0 : 40
              }}<span *ngIf="obra.nombreObra && obra.nombreObra.length > 40"
                >...</span
              >
            </span>
            <!-- Right side: cliente (si está disponible) -->
            <span
              *ngIf="obra.clienteNombre"
              class="option-cliente"
              [ngbTooltip]="'Cliente: ' + obra.clienteNombre"
              placement="top"
              container="body"
            >
              {{ obra.clienteNombre | slice : 0 : 15
              }}<span
                *ngIf="obra.clienteNombre && obra.clienteNombre.length > 15"
                >...</span
              >
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
