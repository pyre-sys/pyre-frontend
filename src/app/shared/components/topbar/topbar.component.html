<!-- TOPBAR MEJORADO CON BREADCRUMBS Y TÍTULO DINÁMICO -->
<nav class="topbar" [class.logged-in]="isLoggedIn && !isSmallScreen">
  <div class="topbar-container">
    <!-- Botón hamburguesa (móvil) - icono moderno que cambia según el estado del sidebar -->
    <button
      *ngIf="isLoggedIn && isSmallScreen"
      class="btn-hamburger"
      (click)="toggleSidebar()"
      aria-label="Toggle sidebar"
    >
      <!-- Mostrar icono 'compacto' cuando el sidebar está colapsado (isSidebarVisible === false)
           Mostrar icono 'cerrar' o 'chevron' cuando el sidebar está visible -->
      <ng-container *ngIf="!isSidebarVisible; else expandedIcon">
        <!-- Modern hamburger SVG (rounded bars) -->
        <svg
          class="menu-icon"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <rect x="3" y="5" width="18" height="2" rx="1" fill="currentColor" />
          <rect
            x="3"
            y="11"
            width="18"
            height="2"
            rx="1"
            fill="currentColor"
            opacity="0.9"
          />
          <rect
            x="3"
            y="17"
            width="12"
            height="2"
            rx="1"
            fill="currentColor"
            opacity="0.8"
          />
        </svg>
      </ng-container>
      <ng-template #expandedIcon>
        <!-- Chevron / collapse icon when sidebar is open -->
        <svg
          class="chev-icon"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M15 6L9 12L15 18"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </ng-template>
    </button>

    <!-- SECCIÓN DE TÍTULO CON BREADCRUMBS -->
    <div class="topbar-title-section" [@titleChange]>
      <!-- Breadcrumbs (si existen) -->
      <nav
        *ngIf="hasBreadcrumbs && !isSmallScreen"
        class="breadcrumbs"
        aria-label="breadcrumb"
      >
        <ol class="breadcrumb-list">
          <li
            *ngFor="let crumb of breadcrumbs; let last = last"
            class="breadcrumb-item"
            [@breadcrumbSlide]
          >
            <!-- Si tiene ruta, es clickeable -->
            <a
              *ngIf="crumb.route && !last"
              [routerLink]="crumb.route"
              class="breadcrumb-link"
            >
              <i *ngIf="crumb.icon" [class]="'bi ' + crumb.icon + ' me-1'"></i>
              {{ crumb.label }}
            </a>

            <!-- Último elemento o sin ruta -->
            <span
              *ngIf="!crumb.route || last"
              class="breadcrumb-current"
              [class.active]="last"
            >
              <i *ngIf="crumb.icon" [class]="'bi ' + crumb.icon + ' me-1'"></i>
              {{ crumb.label }}
            </span>

            <!-- Separador -->
            <i
              *ngIf="!last"
              class="bi bi-chevron-right breadcrumb-separator"
            ></i>
          </li>
        </ol>
      </nav>

      <!-- Título Principal con Icono -->
      <div class="page-title-container">
        <div class="page-title-wrapper">
          <!-- Título y Subtítulo -->
          <div class="page-title-content">
            <h1 class="page-title">
              {{ pageTitle }}

              <!-- Badge opcional (ej: notificaciones) -->
              <span
                *ngIf="pageBadge"
                class="badge ms-2"
                [class]="'bg-' + pageBadge.color"
              >
                {{ pageBadge.text }}
              </span>
            </h1>

            <!-- Subtítulo (descripción breve) -->
            <p *ngIf="pageSubtitle && !isSmallScreen" class="page-subtitle">
              {{ pageSubtitle }}
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- SECCIÓN DE ALERTAS (Centro-Derecha) -->
    <div class="topbar-alerts-section" *ngIf="isLoggedIn && !isSmallScreen">
      <div
        class="alerts-card"
        (click)="navigateToAlertas()"
        [class.has-alerts]="totalAlertas > 0"
        [class.has-critical]="alertasVencidas > 0"
        [ngbTooltip]="alertsTooltip"
        placement="bottom"
        [@alertsPulse]="alertasVencidas > 0 ? 'critical' : 'normal'"
      >
        <!-- Icono de campana -->
        <div class="alerts-icon">
          <i class="bi bi-bell" [class.bi-bell-fill]="totalAlertas > 0"></i>

          <!-- Indicador de alertas críticas -->
          <div *ngIf="alertasVencidas > 0" class="critical-indicator"></div>
        </div>

        <!-- Contador de alertas -->
        <div class="alerts-counter" *ngIf="totalAlertas > 0">
          <div class="alerts-stats">
            <!-- Alertas pendientes -->
            <span *ngIf="alertasPendientes > 0" class="alert-count pending">
              <i class="bi bi-exclamation-triangle"></i>
              {{ alertasPendientes }}
            </span>

            <!-- Alertas vencidas -->
            <span *ngIf="alertasVencidas > 0" class="alert-count overdue">
              <i class="bi bi-exclamation-octagon"></i>
              {{ alertasVencidas }}
            </span>
          </div>

          <!-- Badge total -->
          <div
            class="total-badge"
            [class.critical]="alertasVencidas > 0"
            [class.warning]="alertasVencidas === 0 && alertasPendientes > 0"
          >
            {{ totalAlertas }}
          </div>
        </div>

        <!-- Estado sin alertas -->
        <div *ngIf="totalAlertas === 0" class="no-alerts">
          <span class="no-alerts-text">Sin alertas</span>
        </div>
      </div>
    </div>

    <!-- SECCIÓN DE ALERTAS MÓVIL (Simplificada) -->
    <div
      class="topbar-alerts-mobile"
      *ngIf="isLoggedIn && isSmallScreen && totalAlertas > 0"
    >
      <button
        class="alerts-mobile-btn"
        (click)="navigateToAlertas()"
        [class.critical]="alertasVencidas > 0"
        [ngbTooltip]="alertsTooltip"
        placement="bottom"
      >
        <i class="bi bi-bell-fill"></i>
        <span class="mobile-badge">{{ totalAlertas }}</span>
      </button>
    </div>

    <!-- SECCIÓN DE USUARIO (Derecha) -->
    <div class="topbar-user-section" *ngIf="isLoggedIn">
      <!-- Información del usuario (desktop) -->
      <div class="user-info" *ngIf="!isSmallScreen">
        <span class="user-pill" [ngbTooltip]="pillTooltip" placement="bottom">
          <i class="bi bi-person-badge me-1"></i>
          {{ displayLegajo || userLegajo }}
        </span>
        <span class="user-role-badge" *ngIf="displayRole">
          {{ displayRole }}
        </span>
      </div>

      <!-- Botón de logout (icono) -->
      <button
        class="logout-icon-btn"
        (click)="confirmLogout()"
        [ngbTooltip]="'Cerrar Sesión'"
        aria-label="Cerrar sesión"
        *ngIf="!isSmallScreen"
      >
        <i class="bi bi-power"></i>
      </button>
    </div>
  </div>
</nav>
