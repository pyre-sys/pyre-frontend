<link
  href="https://fonts.googleapis.com/css2?family=Nunito:wght@400&display=swap"
  rel="stylesheet"
/>

<!-- Topbar Component -->
<app-topbar
  [isLoggedIn]="isLoggedIn"
  [isSmallScreen]="isSmallScreen"
  [userEmail]="userEmail"
  [displayEmail]="displayEmail"
  [userLegajo]="userLegajo"
  [displayLegajo]="displayLegajo"
  [userRole]="displayRole"
  [userLabel]="displayUserLabel"
  [pageTitle]="pageTitle"
  (perfilModalToggled)="onPerfilModalToggled($event)"
  (homeNavigation)="navigateToHome()"
  (logoutRequested)="confirmLogout()"
  (sidebarToggled)="toggleSidebar()"
></app-topbar>

<!-- Sidebar -->
<div *ngIf="isLoggedIn">
  <div
    class="sidebar"
    [ngClass]="{ hidden: !isSidebarVisible, visible: isSidebarVisible }"
  >
    <!-- Logo -->
    <div class="sidebar-img">
      <img
        src="assets/images/logos/logo.png"
        alt="Logo"
        (click)="onLogoClick()"
      />
    </div>

    <!-- Lista de menús principales -->
    <ul class="nav flex-column">
      <li *ngFor="let menu of visibleMenuItems" class="nav-item">
        <!-- Enlace del menú principal -->
        <a class="nav-link" (click)="toggleSubMenu(menu)">
          <i class="{{ menu.icono }}"></i>
          <!-- Icono del menú principal -->
          <span>{{ menu.descripcion }}</span>
          <i
            class="arrow"
            [ngClass]="{ rotate: isMenuExpanded(menu) }"
            *ngIf="getSubMenus(menu).length > 0"
          ></i>
        </a>

        <!-- Submenús -->
        <ul
          [ngClass]="{ 'sub-menu': true, expanded: isMenuExpanded(menu) }"
          *ngIf="getSubMenus(menu).length > 0"
        >
          <li *ngFor="let subMenu of getSubMenus(menu)" class="nav-item">
            <a
              class="nav-link"
              [routerLink]="subMenu.link"
              routerLinkActive="active"
              (click)="navigateToSubMenu(subMenu)"
            >
              <i class="{{ subMenu.icono }}" *ngIf="subMenu.icono"></i>
              <span>{{ subMenu.descripcion }}</span>
            </a>
          </li>
        </ul>
      </li>

      <!-- Nuevo ítem "Perfil" visible solo para roles distintos a SuperAdmin -->
      <li class="nav-item" *ngIf="!isRole('SuperAdmin')">
        <a
          class="nav-link"
          routerLink="/perfil"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="onPerfilLinkClick()"
        >
          <i class="bx bx-user" aria-hidden="true"></i>
          <span>Perfil</span>
        </a>
      </li>
    </ul>

    <!-- Información del usuario logueado -->
    <div class="sidebar-user-info" *ngIf="isLoggedIn">
      <div class="user-pill" [ngbTooltip]="displayUserLabel" placement="top">
        <i class="bi bi-person-badge"></i>
        <span class="user-legajo">{{
          displayLegajo || userLegajo || "Sin legajo"
        }}</span>
      </div>
      <div
        class="user-role-badge"
        [class.superadmin]="isRole('SuperAdmin')"
        [class.supervisor]="isRole('Supervisor')"
        [class.operario]="isRole('Operario')"
        [class.administrativo]="isRole('Administrativo')"
        *ngIf="displayRole"
      >
        {{ displayRole }}
      </div>
    </div>
  </div>
</div>

<!-- El contenido principal se renderiza en <router-outlet> dentro de .main-wrapper -->
<!-- Eliminado el contenedor vacío .main-content para evitar que ocupe espacio y empuje las vistas -->
